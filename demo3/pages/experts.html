<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专家讲坛</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section id="experts" class="section bg-white">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center mb-16 text-gradient">专家讲坛</h2>
    
    <div class="bg-gray-100 rounded-2xl p-10 text-center">
      <div class="mb-8">
        <i class="fas fa-video text-6xl text-blue-500 mb-4"></i>
        <h3 class="text-2xl font-semibold">视频讲堂</h3>
      </div>
      
      <div class="bg-white rounded-lg shadow-lg overflow-hidden max-w-4xl mx-auto">
        <div class="aspect-w-16 aspect-h-9 bg-gray-200">
          <div class="flex items-center justify-center h-full">
            <div class="text-center">
              <i class="fas fa-play-circle text-6xl text-blue-500 mb-4"></i>
              <p class="text-gray-600">视频播放区域</p>
              <p class="text-sm text-gray-500 mt-2">（前期预留位置，后期挂外网链接）</p>
            </div>
          </div>
        </div>
        <div class="p-6">
          <h4 class="text-xl font-semibold mb-2">专家讲坛示例视频</h4>
          <p class="text-gray-600">未来做成"细胞界百家讲坛"，邀请行业专家分享前沿知识</p>
        </div>
      </div>
      
      <div class="mt-12">
        <a href="#" class="btn-primary inline-block px-8 py-3 rounded-full text-white font-medium text-lg">
          查看更多讲座 <i class="fas fa-arrow-right ml-2"></i>
        </a>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="../js/main.js"></script>
</body>
</html>
