<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业观察</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section id="industry" class="section bg-gradient">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center mb-16 text-gradient">行业观察</h2>
    
    <div class="bg-white rounded-2xl shadow-xl p-10">
      <div class="text-center mb-12">
        <h3 class="text-3xl font-semibold mb-4">行业动态</h3>
        <p class="text-gray-600">（前期预留空白位置，后期更新行业动态）</p>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- 示例卡片 -->
        <div class="card bg-white rounded-lg shadow-md overflow-hidden border border-gray-100">
          <div class="h-48 bg-gray-200 flex items-center justify-center">
            <i class="fas fa-newspaper text-4xl text-gray-400"></i>
          </div>
          <div class="p-6">
            <span class="text-sm text-blue-600 font-medium">行业新闻</span>
            <h4 class="text-xl font-semibold mt-2 mb-3">干细胞研究最新进展</h4>
            <p class="text-gray-600 mb-4">了解干细胞领域的最新研究成果和技术突破...</p>
            <a href="#" class="text-blue-600 font-medium flex items-center">
              阅读更多 <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div>
        </div>
        
        <div class="card bg-white rounded-lg shadow-md overflow-hidden border border-gray-100">
          <div class="h-48 bg-gray-200 flex items-center justify-center">
            <i class="fas fa-chart-line text-4xl text-gray-400"></i>
          </div>
          <div class="p-6">
            <span class="text-sm text-green-600 font-medium">市场分析</span>
            <h4 class="text-xl font-semibold mt-2 mb-3">干细胞产业发展趋势</h4>
            <p class="text-gray-600 mb-4">分析全球干细胞产业的发展趋势和市场前景...</p>
            <a href="#" class="text-green-600 font-medium flex items-center">
              阅读更多 <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div>
        </div>
        
        <div class="card bg-white rounded-lg shadow-md overflow-hidden border border-gray-100">
          <div class="h-48 bg-gray-200 flex items-center justify-center">
            <i class="fas fa-file-alt text-4xl text-gray-400"></i>
          </div>
          <div class="p-6">
            <span class="text-sm text-purple-600 font-medium">政策解读</span>
            <h4 class="text-xl font-semibold mt-2 mb-3">干细胞行业政策分析</h4>
            <p class="text-gray-600 mb-4">解读国内外干细胞行业相关政策法规和监管动态...</p>
            <a href="#" class="text-purple-600 font-medium flex items-center">
              阅读更多 <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div>
        </div>
      </div>
      
      <div class="mt-12 text-center">
        <a href="#" class="btn-primary inline-block px-8 py-3 rounded-full text-white font-medium text-lg">
          查看更多动态 <i class="fas fa-arrow-right ml-2"></i>
        </a>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="../js/main.js"></script>
</body>
</html>
